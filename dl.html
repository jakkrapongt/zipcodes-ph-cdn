<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Downloading...</title>
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#1a1a2e;color:#fff;font-family:sans-serif;gap:16px}
a{color:#60a5fa;font-size:14px}
</style>
</head>
<body>
<p>Starting download...</p>
<a id="fallback" style="display:none">Click here if download doesn't start</a>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var file=p.get('file'), name=p.get('name'), back=p.get('back');
  if(!file){document.querySelector('p').textContent='Missing file parameter.';return}
  var url='/'+file;
  var fb=document.getElementById('fallback');
  fb.href=url;
  fb.download=name||file.split('/').pop();
  var a=document.createElement('a');
  a.href=url;
  a.download=name||file.split('/').pop();
  a.click();
  setTimeout(function(){fb.style.display='inline'},2000);
  if(back) setTimeout(function(){location.href=back},3000);
})();
</script>
</body>
</html>
